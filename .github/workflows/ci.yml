name: Validate graph data

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate approved paper graph
        run: python scripts/pipeline.py export
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check generated artifact is current
        run: git diff --exit-code -- paper-data.js README.md

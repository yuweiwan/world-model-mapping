name: Daily Physical AI papers

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: Lookback window in hours
        required: false
        default: "72"
  schedule:
    - cron: "15 0 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, export and validate
        env:
          WM_LLM_API_KEY: ${{ secrets.WM_LLM_API_KEY }}
          WM_LLM_BASE_URL: ${{ vars.WM_LLM_BASE_URL }}
          WM_LLM_MODEL: ${{ vars.WM_LLM_MODEL }}
        run: python scripts/pipeline.py run --since-hours "${{ inputs.since_hours || '72' }}"
      - name: Check for new candidates
        id: changes
        shell: bash
        run: |
          queued="$(python -c "import json; print(json.load(open('data/last_ingest_report.json', encoding='utf-8'))['queued'])")"
          if [[ "$queued" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_date="$(date -u +%Y%m%d)"
          branch="automation/papers-${run_date}-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/review_queue.json data/last_ingest_report.json data/daily paper-data.js
          git commit -m "chore: collect daily Physical AI papers ${run_date}"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" --title "Daily Physical AI papers · ${run_date}" --body-file data/daily/latest.md

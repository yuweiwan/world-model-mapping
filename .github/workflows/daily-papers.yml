name: Daily Physical AI papers

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: Lookback window in hours
        required: false
        default: "72"
  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: daily-physical-ai-papers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOMATION_BRANCH: automation/daily-physical-ai-papers
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Continue the open review branch when one exists
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          base_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$base_branch" "$AUTOMATION_BRANCH" || git fetch origin "$base_branch"
          pr_number="$(gh pr list --state open --base "$base_branch" --head "$AUTOMATION_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            git switch -C "$AUTOMATION_BRANCH" "origin/$AUTOMATION_BRANCH"
            git merge --no-edit "origin/$base_branch"
            echo "push_mode=normal" >> "$GITHUB_OUTPUT"
          else
            git switch -C "$AUTOMATION_BRANCH" "origin/$base_branch"
            echo "push_mode=reset" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect, export and validate
        env:
          WM_LLM_API_KEY: ${{ secrets.WM_LLM_API_KEY }}
          WM_LLM_BASE_URL: ${{ vars.WM_LLM_BASE_URL }}
          WM_LLM_MODEL: ${{ vars.WM_LLM_MODEL }}
        run: python scripts/pipeline.py run --since-hours "${{ inputs.since_hours || '72' }}"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check collection health
        id: collection
        run: python scripts/automation_report.py assess
      - name: Upload the collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-paper-report-${{ github.run_number }}
          path: |
            data/last_ingest_report.json
            data/daily/latest.json
            data/daily/latest.md
          if-no-files-found: warn
          retention-days: 30
      - name: Update the review pull request
        if: steps.collection.outputs.queued != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/automation_report.py queue-summary --output "$RUNNER_TEMP/daily-paper-pr.md"
          git add data/review_queue.json data/last_ingest_report.json data/daily paper-data.js README.md
          git commit -m "chore: update daily Physical AI paper queue $(date -u +%Y-%m-%d)"
          if [[ "${{ steps.review.outputs.push_mode }}" == "reset" ]]; then
            git push --force-with-lease origin "$AUTOMATION_BRANCH"
          else
            git push origin "$AUTOMATION_BRANCH"
          fi
          pr_number="${{ steps.review.outputs.pr_number }}"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body-file "$RUNNER_TEMP/daily-paper-pr.md"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$AUTOMATION_BRANCH" \
              --title "Daily Physical AI paper review queue" \
              --body-file "$RUNNER_TEMP/daily-paper-pr.md"
          fi
